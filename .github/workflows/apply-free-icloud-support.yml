name: Apply free iCloud support copy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply strict support copy patch
        run: python3 Tools/apply_free_icloud_copy.py
      - name: Validate and commit
        run: |
          git diff --check
          grep -q "All creative tools and iCloud backup are free" index.html
          grep -q "iCloud backup is free and is not part of the paid Lifetime entitlement" privacy/index.html
          git config user.name "asympta-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: align support copy with free iCloud backup"
          git push origin HEAD:${{ github.head_ref }}
